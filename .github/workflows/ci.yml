name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose
        working-directory: apps/self-host
        run: docker compose config -q
      - name: Build images
        working-directory: apps/self-host
        run: docker compose build
