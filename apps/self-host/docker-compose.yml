# okra self-host — the whole thing: a durable workerd orchestrator + parser container(s).
#   docker compose up --build
# Orchestrator API on 127.0.0.1:8787 (loopback by default — the beta API is unauthenticated;
# to expose on the network put it behind your own auth/ingress, or set HOST_BIND=0.0.0.0).
name: okra-self-host

services:
  orchestrator:
    build: ./orchestrator
    ports:
      - "${HOST_BIND:-127.0.0.1}:${PORT:-8787}:8787"
    volumes:
      - okra-do-data:/data        # durable DocumentAgent state (the page results + checkpoints)
    depends_on:
      liteparse:
        condition: service_healthy   # don't accept work until the parser is ready
    restart: unless-stopped

  liteparse:
    build: ./parsers/liteparse
    # internal-only; the orchestrator reaches it at http://liteparse:8080
    restart: unless-stopped

  # Optional second parser: Google Gemini vision (the cloud /parse "gemini-vision").
  # BYOK — set GOOGLE_API_KEY (or GEMINI_API_KEY) in your env / .env to use it.
  # Pick it per upload with parser="gemini-vision"; liteparse stays the default.
  gemini-vision:
    build: ./parsers/gemini-vision
    # internal-only; the orchestrator reaches it at http://gemini-vision:8081
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped

volumes:
  okra-do-data:
