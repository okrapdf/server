name: okrapdf-server

# Single-service default: the okraPDF self-host server with built-in local
# engines (poppler + tesseract parser, basic WCAG audit, basic PII redactor).
# Everything runs in-process — no database, no Redis, no okraPDF cloud.
#
#   cp .env.example .env      # then set OKRA_API_KEY (openssl rand -hex 24)
#   docker compose up --build
#
# Engines run in-process by default. To run parse/audit/redact as isolated
# capability services instead, point the OKRA_CAPABILITY_*_URL vars at them
# (the engine contracts live in runtime/capabilities/*.engine.json).

services:
  okra:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8787}:8787"
    environment:
      OKRA_BASE_URL: "${OKRA_BASE_URL:-http://localhost:8787}"
      OKRA_DATA_DIR: "/data/okrapdf"
      # Local auth secret that gates mutating routes (upload / workflows / runs).
      # NOT an okraPDF cloud key — generate your own: openssl rand -hex 24
      OKRA_API_KEY: "${OKRA_API_KEY:?set OKRA_API_KEY in .env — generate with: openssl rand -hex 24}"
      OKRA_AUTH_MODE: "${OKRA_AUTH_MODE:-single_owner}"
      OKRA_REGISTRATION_MODE: "${OKRA_REGISTRATION_MODE:-invite_only}"
      OKRA_FIRST_OWNER_EMAIL: "${OKRA_FIRST_OWNER_EMAIL:-owner@example.com}"
    volumes:
      - okra-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

volumes:
  okra-data:
